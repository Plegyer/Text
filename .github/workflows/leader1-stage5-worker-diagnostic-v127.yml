name: Leader1 Stage5 worker independent diagnostic v127
on:
  push:
    branches: [qa-stage5-worker-diagnostic-v127]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9af6ffbb5522aec7c7511d10be06533e39c8c17d
          fetch-depth: 1
      - name: Exact SHA guard
        shell: powershell
        run: |
          if((git rev-parse HEAD).Trim() -ne "9af6ffbb5522aec7c7511d10be06533e39c8c17d"){throw "wrong SHA"}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Preserve immutable originals as Git blob bytes
        shell: powershell
        run: |
          node -e "const fs=require('node:fs');const cp=require('node:child_process');const p=['mindy-successor/prior-work/astra/prototype-m3.2/tests/fixtures/final-player-facing-golden-v54.json','mindy-successor/prior-work/astra/prototype-m3.2/tests/final-player-facing-golden-manifest-v55.test.ts','mindy-successor/prior-work/astra/prototype-m3.2/tests/fixtures/final-ui-accessibility-smoke-v60.json','mindy-successor/prior-work/astra/prototype-m3.2/tests/fixtures/final-save-migration-golden-v57.json','mindy-successor/docs/tasks/CHAT4_D46_D47_LEGACY_GOLDEN_OPERATIONS_v53.json','mindy-successor/docs/tasks/CHAT4_D46_D47_LEGACY_GOLDEN_GATE_v54.json'];for(const x of p){const b=cp.execFileSync('git',['-C',process.env.GITHUB_WORKSPACE,'show','HEAD:'+x]);fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/'+x,b);console.log('RESTORED',x,b.length)}"
      - name: Install
        run: npm ci
      - name: Typecheck diagnostic
        continue-on-error: true
        run: npm run typecheck
      - name: Validate
        run: npm run validate
      - name: Build
        run: npm run build
      - name: Stage5 save golden package
        continue-on-error: true
        run: node --experimental-strip-types --test tests/final-historical-fixtures-v55.test.ts tests/final-save-migration-golden-v57.test.ts
      - name: Stage5 player frozen plus target and cross-contract
        continue-on-error: true
        shell: powershell
        run: |
          $env:FINAL_PLAYER_FACING_GOLDEN_TARGET="1"
          $env:FINAL_UI_ACCESSIBILITY_SMOKE_TARGET="1"
          $env:FINAL_PLAYER_FACING_CROSS_CONTRACT_TARGET="1"
          node --experimental-strip-types --test tests/final-player-facing-golden-manifest-v55.test.ts tests/final-player-facing-golden-release-target-stage5-v1.test.ts tests/final-ui-accessibility-smoke-v61.test.ts tests/final-player-facing-cross-contract-v64.test.ts
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Full regression tests diagnostic
        continue-on-error: true
        run: npm test
