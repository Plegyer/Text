name: Leader1 D39 live consumer gate v88
on:
  push:
    branches: [leader1/d39-live-consumer-gate-v88]
permissions:
  contents: write
jobs:
  gate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 42a34904fe9ab2d04d53902a82e53643d3255642
          fetch-depth: 1
      - name: Exact SHA guard
        shell: powershell
        run: |
          $expected="42a34904fe9ab2d04d53902a82e53643d3255642"
          $actual=(git rev-parse HEAD).Trim()
          if($actual -ne $expected){throw "Exact source guard failed: $actual"}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate
      - run: npm run build
      - name: Focused D39 live consumers
        run: >
          node --experimental-strip-types --test
          tests/d39-formal-introduction-assassin-v46.test.ts
          tests/school-life-content-reload.test.ts
          tests/school-night-study-adapter.test.ts
          tests/assassin-boundaries.test.ts
          tests/assassin-natural-acceptance.test.ts
          tests/assassin-production-presentation.test.ts
          tests/assassin-runtime-invariants.test.ts
          tests/palace-d39-reward-producer-v20.test.ts
          tests/strong-meta-registry-v7.test.ts
          tests/strong-meta-engine-integration-v7.test.ts
          tests/strong-meta-d30-runtime-v7.test.ts
          tests/palace-rich6-runtime-v15.test.ts
          tests/palace-player-facing-ui-v16.test.ts
          tests/palace-player-facing-ui-renderer-v16.test.ts
          tests/palace-prince-narrative-producer-v18.test.ts
          tests/palace-prince-narrative-renderer-v18.test.ts
          tests/palace-final-prose-media-v19.test.ts
      - name: Publish evidence
        shell: powershell
        working-directory: .
        run: |
          $path="mindy-successor/docs/tasks/LEADER1_D39_LIVE_CONSUMER_RESULT_v88.json"
          $tmp=Join-Path $env:RUNNER_TEMP "d39-live-v88.json"
          $obj=[ordered]@{
            schemaVersion=1
            id="leader1.d39-live-consumer.v88"
            status="PASS"
            sourceSha="42a34904fe9ab2d04d53902a82e53643d3255642"
            checks=[ordered]@{typecheck="PASS";validate="PASS";build="PASS";focusedD39LiveConsumers="PASS"}
            runId="${{ github.run_id }}"
          }
          $obj|ConvertTo-Json -Depth 5|Set-Content -Encoding utf8 $tmp
          git fetch origin leader1/d39-live-consumer-gate-v88
          git checkout -B leader1/d39-live-consumer-gate-v88 origin/leader1/d39-live-consumer-gate-v88
          Copy-Item $tmp $path
          git config user.name "Leader1 QA"
          git config user.email "actions@users.noreply.github.com"
          git add $path
          git commit -m "qa(leader1): publish D39 live consumer v88"
          git push origin HEAD:leader1/d39-live-consumer-gate-v88
