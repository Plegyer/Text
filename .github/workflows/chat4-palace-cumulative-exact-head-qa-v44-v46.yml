name: Chat4 Palace cumulative exact-head QA v44-v46

on:
  push:
    branches:
      - chat4/palace-cumulative-exact-head-qa-v44
    paths:
      - '.github/workflows/chat4-palace-cumulative-exact-head-qa-v44-v46.yml'
  workflow_dispatch:

jobs:
  palace-v19-exact-head:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - name: Checkout frozen Palace v19
        uses: actions/checkout@v4
        with:
          ref: 6cf19169b92fa709e8ae51cf73ff72ef2c0fac19
          fetch-depth: 1

      - name: Exact SHA guard
        shell: powershell
        run: |
          $expected = "6cf19169b92fa709e8ae51cf73ff72ef2c0fac19"
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "expected=$expected"
          Write-Host "actual=$actual"
          if ($actual -ne $expected) { throw "Exact-head guard failed: $actual" }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Validate
        id: validate
        continue-on-error: true
        run: npm run validate

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Static Palace v45 invariants
        id: staticv45
        continue-on-error: true
        shell: powershell
        run: |
          @'
          const fs=require('fs');
          const assert=require('assert/strict');
          const defs=JSON.parse(fs.readFileSync('content/definitions.json','utf8'));
          const progression=JSON.parse(fs.readFileSync('content/packs/palace-progression.json','utf8'));
          const invitation=JSON.parse(fs.readFileSync('content/packs/palace-invitation.json','utf8'));
          const prince=JSON.parse(fs.readFileSync('content/packs/palace-prince-confrontation.json','utf8'));
          const presentation=JSON.parse(fs.readFileSync('content/presentation.json','utf8'));

          const duties=defs.actions.filter(a=>a.id.startsWith('palace.duty.'));
          assert.equal(duties.length,15,'exactly 15 structural duties');

          const confront=defs.actions.find(a=>a.id==='palace.confront-prince');
          assert.ok(confront,'missing confrontation action');
          assert.equal(confront.cost.money,0);
          assert.equal(confront.cost.energy,0);
          const statConditions=confront.conditions.filter(c=>c.kind==='stat');
          assert.equal(statConditions.length,12);
          assert.ok(statConditions.every(c=>c.op==='gte'&&c.value===91));
          assert.equal(statConditions.some(c=>c.stat==='lust'),false);
          const forbiddenKinds=new Set(['itemCount','itemCapability','schoolTrack','relationshipStage','activityState','metaUnlock']);
          assert.equal(confront.conditions.some(c=>forbiddenKinds.has(c.kind)),false);

          const quest=(defs.quests||[]).find(q=>q.id==='palace.prince-confrontation');
          assert.ok(quest);
          assert.deepEqual(quest.stages,['ready','audit-record','name-contradiction','define-boundary','reconstruct-return','defeated']);

          assert.equal(prince.events.length,4);
          assert.ok(prince.events.every(e=>e.blocking===true));
          assert.ok(prince.events.every(e=>e.choices.some(c=>c.id==='not-yet')));
          const writers=[];
          for(const e of prince.events)for(const choice of e.choices||[])for(const effect of choice.effects||[]){
            if(effect.kind==='addWorldFact'&&effect.fact==='palace.prince-defeated')writers.push([e.id,choice.id]);
          }
          assert.deepEqual(writers,[['palace.prince-confrontation.phase-04-reconstruct-return','present-origin-trace']]);
          const princeRaw=JSON.stringify(prince);
          assert.equal(/commitEnding|completeEnding|acceptEnding/.test(princeRaw),false);
          assert.equal(/"chance"|"rng"|"random"/i.test(princeRaw),false);
          assert.ok(princeRaw.includes('world-remains-real'));
          assert.ok(princeRaw.includes('unsupported-unreal'));

          const milestones=new Map(progression.events.map(e=>[e.id,e]));
          const duty12=JSON.stringify(milestones.get('palace.progression.milestone-12-crossroads'));
          const duty15=JSON.stringify(milestones.get('palace.progression.milestone-15-outcome-ready'));
          assert.equal(/Threshold Archive|Palace Concordance|real inter-world Threshold/.test(duty12),false);
          assert.ok(/Palace Concordance/.test(duty15));
          assert.ok(/Threshold Archive/.test(duty15));
          assert.ok(/real inter-world Threshold/.test(duty15));
          assert.ok(/still do not know what originally displaced you/i.test(duty15));

          const inviteRaw=JSON.stringify(invitation);
          assert.ok(inviteRaw.includes('palace.d23-qualified'));
          assert.ok(inviteRaw.includes('palace.access-granted'));
          assert.equal(/prophecy/i.test(inviteRaw),true);

          const palaceEndings=defs.endings.filter(e=>e.id.startsWith('ending.palace.'));
          assert.equal(palaceEndings.length,4);
          assert.deepEqual(
            palaceEndings.map(e=>e.reward).sort(),
            ['palace.court-power.formal-introduction','palace.inner-truth.source-method','palace.service-life.steady-practice','palace.true.cap-200'].sort()
          );
          const palaceSurface=JSON.stringify({palaceEndings,progression,invitation,prince});
          assert.equal(/strongMetaFormalIntroductionAvailable|useStrongMetaFormalIntroduction|strongMetaKnowledge/.test(palaceSurface),false);

          const slots=Object.keys(presentation.slots||{}).filter(k=>k.includes('palace'));
          assert.equal(slots.length,19);
          const sources=slots.map(k=>presentation.slots[k]?.source).filter(Boolean);
          assert.ok(sources.every(s=>s==='assets/stage-town.svg'||s==='assets/stage-room.svg'));

          console.log('STATIC_V45_PASS duties=15 statGates=12 princePhases=4 presentationSlots=19');
          '@ | Set-Content -Encoding utf8 .chat4-palace-v45-static.cjs
          node .chat4-palace-v45-static.cjs
          Remove-Item .chat4-palace-v45-static.cjs

      - name: D23 and Palace v15 runtime
        id: v15
        continue-on-error: true
        run: >
          node --experimental-strip-types --test
          tests/palace-d23-consumer-integration-v8.test.ts
          tests/palace-derived-unlock.test.ts
          tests/palace-rich6-runtime-v15.test.ts

      - name: Palace v16 UI model renderer
        id: v16
        continue-on-error: true
        run: >
          node --experimental-strip-types --test
          tests/palace-player-facing-ui-v16.test.ts
          tests/palace-player-facing-ui-renderer-v16.test.ts

      - name: Palace v18 Prince narrative runtime renderer
        id: v18
        continue-on-error: true
        run: >
          node --experimental-strip-types --test
          tests/palace-prince-narrative-producer-v18.test.ts
          tests/palace-prince-narrative-renderer-v18.test.ts

      - name: Palace v19 prose media
        id: v19
        continue-on-error: true
        run: >
          node --experimental-strip-types --test
          tests/palace-final-prose-media-v19.test.ts

      - name: Save reload ending commit adjacency
        id: adjacency
        continue-on-error: true
        run: >
          node --experimental-strip-types --test
          tests/ending-meta.test.ts
          tests/qa-exactly-once-reload.test.ts

      - name: Aggregate exact-head result
        shell: powershell
        run: |
          $names = @("typecheck","validate","build","staticv45","v15","v16","v18","v19","adjacency")
          $values = @(
            "${{ steps.typecheck.outcome }}",
            "${{ steps.validate.outcome }}",
            "${{ steps.build.outcome }}",
            "${{ steps.staticv45.outcome }}",
            "${{ steps.v15.outcome }}",
            "${{ steps.v16.outcome }}",
            "${{ steps.v18.outcome }}",
            "${{ steps.v19.outcome }}",
            "${{ steps.adjacency.outcome }}"
          )
          for ($i=0; $i -lt $names.Length; $i++) {
            Write-Host "$($names[$i])=$($values[$i])"
          }
          if ($values -contains "failure") {
            throw "Frozen Palace v19 exact-head QA contains one or more failing gates."
          }
