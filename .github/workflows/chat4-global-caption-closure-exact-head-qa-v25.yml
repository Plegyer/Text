name: Chat 4 global caption closure exact-head QA v25

on:
  push:
    branches:
      - chat4/qa-global-caption-closure-v25
    paths:
      - '.github/workflows/chat4-global-caption-closure-exact-head-qa-v25.yml'

concurrency:
  group: chat4-global-caption-closure-exact-head-qa-v25
  cancel-in-progress: true

jobs:
  exact-head-qa:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2

    steps:
      - name: Checkout exact frozen implementation
        uses: actions/checkout@v4
        with:
          ref: e9f0805068a8144a3b3cebaf07803b7090732bfd
          fetch-depth: 0

      - name: Verify exact implementation HEAD
        shell: cmd
        run: |
          for /f "delims=" %%i in ('git rev-parse HEAD') do set ACTUAL=%%i
          echo Exact frozen implementation: %ACTUAL%
          if not "%ACTUAL%"=="e9f0805068a8144a3b3cebaf07803b7090732bfd" exit /b 1

      - name: Verify production firewall
        shell: powershell
        run: |
          $base = '6e0ea2b8b8bd3dd9432b38e8dbd73493cb787c80'
          $root = $env:GITHUB_WORKSPACE

          $changed = @(git -C $root diff --name-only $base HEAD)
          $changed | ForEach-Object { Write-Host $_ }

          $allowed = @(
            'mindy-successor/prior-work/astra/prototype-m3.2/content/localization.json',
            'mindy-successor/prior-work/astra/prototype-m3.2/tests/global-caption-closure-producer-v29.test.ts'
          )

          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -ne 0) {
            Write-Error ("Unexpected implementation changed files: " + ($unexpected -join ', '))
            exit 1
          }

          if ($changed.Count -ne 2) {
            Write-Error ("Expected exactly 2 changed files, found " + $changed.Count)
            exit 1
          }

          git -C $root diff --exit-code $base HEAD -- `
            mindy-successor/prior-work/astra/prototype-m3.2/src `
            mindy-successor/prior-work/astra/prototype-m3.2/content/definitions.json `
            mindy-successor/prior-work/astra/prototype-m3.2/content/packs `
            mindy-successor/prior-work/astra/prototype-m3.2/content/presentation.json

          if ($LASTEXITCODE -ne 0) {
            Write-Error 'Implementation changed runtime/mechanics/presentation routing.'
            exit 1
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Global caption closure and localization/presentation parity adjacency
        run: >
          node --experimental-strip-types --test
          tests/global-caption-closure-producer-v29.test.ts
          tests/localization.test.ts
          tests/presentation-locale-accessibility-parity-v7.test.ts
          tests/presentation-locale-accessibility-v9.test.ts
          tests/presentation-source-integrity-v9.test.ts
          tests/presentation-full-roster-a11y-c2-117.test.ts
