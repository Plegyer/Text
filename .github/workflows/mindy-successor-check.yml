name: mindy-successor check

on:
  pull_request:
    paths:
      - 'mindy-successor/**'
      - '.github/workflows/mindy-successor-check.yml'
  push:
    branches:
      - main
    paths:
      - 'mindy-successor/**'
      - '.github/workflows/mindy-successor-check.yml'

jobs:
  check:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Full check
        run: npm run check
