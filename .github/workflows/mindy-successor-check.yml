name: mindy-successor D31 full-suite diagnostics

on:
  pull_request:
    paths:
      - 'mindy-successor/prior-work/astra/prototype-m3.2/**'
      - '.github/workflows/mindy-successor-check.yml'

jobs:
  check:
    if: startsWith(github.head_ref, 'chat2/qa-')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: D31 cross-system diagnostics
        run: node --experimental-strip-types --test tests/tavern-natural-acceptance.test.ts tests/undead-farm-natural-acceptance.test.ts
