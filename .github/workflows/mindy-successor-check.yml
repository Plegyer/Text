name: mindy-successor Strong Meta full-CI repair focused check

on:
  pull_request:
    paths:
      - 'mindy-successor/prior-work/astra/prototype-m3.2/**'
      - '.github/workflows/mindy-successor-check.yml'

concurrency:
  group: mindy-successor-strong-meta-fullci-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: startsWith(github.head_ref, 'chat2/qa-')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Focused repair validation
        shell: powershell
        run: |
          $failed = 0
          function Run-Group([string]$name, [string]$command) {
            Write-Host "=== $name ==="
            Invoke-Expression $command
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::$name failed"
              $script:failed = 1
            }
          }

          Run-Group "typecheck" "npm run typecheck"
          Run-Group "validate" "npm run validate"
          Run-Group "build" "npm run build"

          Run-Group "fullci-failure-files" "node --experimental-strip-types --test tests/gopher.test.ts tests/school-activation-boundary.test.ts tests/school-blocking-scene-compat.test.ts tests/school-body-confidence-lust-d20.test.ts tests/school-engine-adapter.test.ts tests/school-life-content-reload.test.ts tests/school-production-v11-locale-save.test.ts tests/school-target.test.ts"

          Run-Group "strong-meta-migration-palace" "node --experimental-strip-types --test tests/strong-meta-registry-v7.test.ts tests/strong-meta-engine-integration-v7.test.ts tests/migration.test.ts tests/hard-work-meta-migration-v5.test.ts tests/hard-work-stat-cap-d24.test.ts tests/palace-d23-consumer-integration-v8.test.ts"

          if ($failed -ne 0) { exit 1 }
