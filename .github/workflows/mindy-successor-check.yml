name: mindy-successor D40 Merchant School cascade focused check

on:
  pull_request:
    paths:
      - 'mindy-successor/prior-work/astra/prototype-m3.2/**'
      - '.github/workflows/mindy-successor-check.yml'

concurrency:
  group: mindy-successor-d40-merchant-school-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: startsWith(github.head_ref, 'chat2/qa-')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Focused Merchant School cascade validation
        shell: powershell
        run: |
          $failed = 0
          function Run-Group([string]$name, [string]$command) {
            Write-Host "=== $name ==="
            Invoke-Expression $command
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::$name failed"
              $script:failed = 1
            }
          }
          Run-Group "typecheck" "npm run typecheck"
          Run-Group "validate" "npm run validate"
          Run-Group "build" "npm run build"
          Run-Group "d40-core" "node --experimental-strip-types --test tests/d40-advanced-endings-tranche-b-v11.test.ts"
          Run-Group "merchant-school" "node --experimental-strip-types --test tests/school-merchant-v17-live-inventory.test.ts"
          Run-Group "other-d40-school" "node --experimental-strip-types --test tests/school-guard-v16-live-inventory.test.ts tests/school-artist-geisha-v18-live-inventory.test.ts"
          Run-Group "reaction-regression" "node --experimental-strip-types --test tests/event-resolver.test.ts tests/reaction-priority.test.ts"
          if ($failed -ne 0) { exit 1 }
