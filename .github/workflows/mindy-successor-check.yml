name: mindy-successor D31 repair focused check

on:
  pull_request:
    paths:
      - 'mindy-successor/prior-work/astra/prototype-m3.2/**'
      - '.github/workflows/mindy-successor-check.yml'

concurrency:
  group: mindy-successor-d31-repair-focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: startsWith(github.head_ref, 'chat2/qa-')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Focused D31 repair validation
        shell: powershell
        run: |
          $failed = 0
          function Run-Group([string]$name, [string]$command) {
            Write-Host "=== $name ==="
            Invoke-Expression $command
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::$name failed"
              $script:failed = 1
            }
          }

          Run-Group "typecheck" "npm run typecheck"
          Run-Group "validate" "npm run validate"
          Run-Group "build" "npm run build"

          Run-Group "d31-seasonal-acceptance" "node --experimental-strip-types --test tests/ordinary-work-seasonal-negative-tradeoffs.test.ts"

          Run-Group "seven-stale-map-tests" "node --experimental-strip-types --test tests/assassin-runtime-invariants.test.ts tests/chat3-artist-geisha-live-authored-v19.test.ts tests/chat3-guard-live-authored-v17.test.ts tests/chat3-hunter-live-authored-v16.test.ts tests/chat3-merchant-live-authored-v18.test.ts tests/chat3-tavern-live-authored-v15.test.ts tests/prostitute-runtime-invariants.test.ts"

          Run-Group "ordinary-hard-work-meta" "node --experimental-strip-types --test tests/all-ten-career-availability-smoke.test.ts tests/ending-meta.test.ts tests/hard-work-meta-infra-prep.test.ts tests/hard-work-meta-migration-v5.test.ts tests/hard-work-package-catalog-runtime.test.ts tests/hard-work-palace-meta-smoke.test.ts tests/hard-work-stat-cap-d24.test.ts tests/ordinary-hard-work-meta-production.test.ts tests/palace-derived-unlock.test.ts"

          Run-Group "new-start-ui" "node --experimental-strip-types --test tests/hard-work-newstart-presentation-v2.test.ts tests/hard-work-newstart-ui-v2.test.ts tests/ui.test.ts"

          Run-Group "palace-d23" "node --experimental-strip-types --test tests/palace-d23-consumer-integration-v8.test.ts tests/hard-work-palace-meta-smoke.test.ts tests/palace-derived-unlock.test.ts"

          Run-Group "school-d20" "node --experimental-strip-types --test tests/school-body-confidence-lust-d20.test.ts tests/school-engine-adapter.test.ts tests/school-production-v11-locale-save.test.ts tests/school-target.test.ts"

          Run-Group "assassin-prostitute-natural-runtime" "node --experimental-strip-types --test tests/assassin-natural-acceptance.test.ts tests/assassin-runtime-invariants.test.ts tests/prostitute-natural-acceptance.test.ts tests/prostitute-runtime-invariants.test.ts"

          Run-Group "tavern-undead-natural-routes" "node --experimental-strip-types --test tests/tavern-natural-acceptance.test.ts tests/undead-farm-natural-acceptance.test.ts"

          if ($failed -ne 0) { exit 1 }
