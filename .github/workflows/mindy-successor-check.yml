name: mindy-successor check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mindy-successor/prior-work/astra/prototype-m3.2/**'
      - '.github/workflows/mindy-successor-check.yml'
  push:
    branches:
      - main
    paths:
      - 'mindy-successor/prior-work/astra/prototype-m3.2/**'
      - '.github/workflows/mindy-successor-check.yml'

concurrency:
  group: mindy-successor-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # One self-hosted runner is a scarce integration gate.
    # Producer PRs (chat3..chat6) intentionally skip the full check.
    # Chat 2 / Lead QA branches own PR CI; main and manual dispatch still run.
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'chat2/qa-') ||
      startsWith(github.head_ref, 'chat2/assembly-') ||
      startsWith(github.head_ref, 'lead/ci-') ||
      startsWith(github.head_ref, 'lead/integrate-')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json
      - name: Restore frozen Golden authority byte-exact on Windows
        shell: powershell
        run: |
          node -e "const fs=require('node:fs');const cp=require('node:child_process');const paths=['mindy-successor/prior-work/astra/prototype-m3.2/tests/fixtures/final-player-facing-golden-v54.json','mindy-successor/prior-work/astra/prototype-m3.2/tests/final-player-facing-golden-manifest-v55.test.ts','mindy-successor/prior-work/astra/prototype-m3.2/tests/fixtures/final-ui-accessibility-smoke-v60.json','mindy-successor/prior-work/astra/prototype-m3.2/tests/fixtures/final-save-migration-golden-v57.json','mindy-successor/docs/tasks/CHAT4_D46_D47_LEGACY_GOLDEN_OPERATIONS_v53.json','mindy-successor/docs/tasks/CHAT4_D46_D47_LEGACY_GOLDEN_GATE_v54.json'];for(const path of paths){const bytes=cp.execFileSync('git',['-C',process.env.GITHUB_WORKSPACE,'show','HEAD:'+path]);fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/'+path,bytes);console.log('ORIGINAL',path,bytes.length)}"
      - name: Install dependencies
        run: npm ci
      - name: Full check
        run: npm run check
