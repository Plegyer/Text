name: mindy-successor D40 focused check

on:
  pull_request:
    paths:
      - 'mindy-successor/prior-work/astra/prototype-m3.2/**'
      - '.github/workflows/mindy-successor-check.yml'

concurrency:
  group: mindy-successor-d40-focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: startsWith(github.head_ref, 'chat2/qa-')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Focused D40 validation
        shell: powershell
        run: |
          $failed = 0
          function Run-Group([string]$name, [string]$command) {
            Write-Host "=== $name ==="
            Invoke-Expression $command
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::$name failed"
              $script:failed = 1
            }
          }

          Run-Group "typecheck" "npm run typecheck"
          Run-Group "validate" "npm run validate"
          Run-Group "build" "npm run build"

          Run-Group "d40-advanced-endings" "node --experimental-strip-types --test tests/d40-advanced-endings-tranche-b-v11.test.ts"
          Run-Group "strong-meta-d40-binding" "node --experimental-strip-types --test tests/strong-meta-registry-v7.test.ts tests/strong-meta-engine-integration-v7.test.ts tests/ending-meta.test.ts"
          Run-Group "migration-save" "node --experimental-strip-types --test tests/migration.test.ts tests/late-career-schema4-compat.test.ts tests/hard-work-meta-migration-v5.test.ts"
          Run-Group "assassin-prostitute-natural-routes" "node --experimental-strip-types --test tests/assassin-natural-acceptance.test.ts tests/prostitute-natural-acceptance.test.ts"
          Run-Group "palace-d23" "node --experimental-strip-types --test tests/palace-d23-consumer-integration-v8.test.ts"
          Run-Group "d31-exact-map" "node --experimental-strip-types --test tests/ordinary-work-seasonal-negative-tradeoffs.test.ts tests/assassin-runtime-invariants.test.ts tests/chat3-artist-geisha-live-authored-v19.test.ts tests/chat3-guard-live-authored-v17.test.ts tests/chat3-hunter-live-authored-v16.test.ts tests/chat3-merchant-live-authored-v18.test.ts tests/chat3-tavern-live-authored-v15.test.ts tests/prostitute-runtime-invariants.test.ts"
          Run-Group "d31-natural-routes" "node --experimental-strip-types --test tests/tavern-natural-acceptance.test.ts tests/undead-farm-natural-acceptance.test.ts tests/assassin-natural-acceptance.test.ts tests/prostitute-natural-acceptance.test.ts"

          if ($failed -ne 0) { exit 1 }
