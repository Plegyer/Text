name: mindy-successor New Start+ focused check

on:
  pull_request:
    paths:
      - 'mindy-successor/prior-work/astra/prototype-m3.2/**'
      - '.github/workflows/mindy-successor-check.yml'

concurrency:
  group: mindy-successor-newstart-focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: startsWith(github.head_ref, 'chat2/qa-')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Focused New Start+ validation
        shell: powershell
        run: |
          $failed = 0
          function Run-Group([string]$name, [string]$command) {
            Write-Host "=== $name ==="
            Invoke-Expression $command
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::$name failed"
              $script:failed = 1
            }
          }

          Run-Group "typecheck" "npm run typecheck"
          Run-Group "validate" "npm run validate"
          Run-Group "build" "npm run build"

          Run-Group "new-start-ui" "node --experimental-strip-types --test tests/hard-work-newstart-presentation-v2.test.ts tests/hard-work-newstart-ui-v2.test.ts"
          Run-Group "ui-regression" "node --experimental-strip-types --test tests/ui.test.ts"
          Run-Group "d21-d24-runtime" "node --experimental-strip-types --test tests/all-ten-career-availability-smoke.test.ts tests/ending-meta.test.ts tests/hard-work-meta-infra-prep.test.ts tests/hard-work-meta-migration-v5.test.ts tests/hard-work-package-catalog-runtime.test.ts tests/hard-work-palace-meta-smoke.test.ts tests/hard-work-stat-cap-d24.test.ts tests/ordinary-hard-work-meta-production.test.ts tests/palace-derived-unlock.test.ts"
          Run-Group "migration-compat" "node --experimental-strip-types --test tests/migration.test.ts tests/late-career-schema4-compat.test.ts tests/gopher.test.ts tests/journal-outcome-localization.test.ts"

          if ($failed -ne 0) { exit 1 }
