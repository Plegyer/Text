name: SUSLIK2 temporary source export
on:
  push:
    branches:
      - suslik-2/intro-v1
    paths:
      - .github/workflows/suslik-2-export.yml
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Archive existing SUSLIK 2 directory
        run: tar -czf suslik-2-original.tgz suslik-2/
      - uses: actions/upload-artifact@v4
        with:
          name: suslik2-existing-source
          path: suslik-2-original.tgz
          if-no-files-found: error
          retention-days: 1
