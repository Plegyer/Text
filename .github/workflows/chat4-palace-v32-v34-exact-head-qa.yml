name: Chat4 Palace v32-v34 exact-head QA

on:
  push:
    branches:
      - chat4/palace-exact-head-qa-bundle-v32
    paths:
      - .github/workflows/chat4-palace-v32-v34-exact-head-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  palace-v18-exact-head:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - name: Checkout exact v18 producer head
        uses: actions/checkout@v4
        with:
          ref: 67f948d185883d8e706dad522e5010bff8e2bd48
          fetch-depth: 1
      - name: Exact v18 SHA guard
        shell: cmd
        working-directory: .
        run: |
          for /f "delims=" %%i in ('git rev-parse HEAD') do set HEADSHA=%%i
          echo %HEADSHA%
          if not "%HEADSHA%"=="67f948d185883d8e706dad522e5010bff8e2bd48" exit /b 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json
      - id: install
        name: npm ci
        run: npm ci
      - id: typecheck
        name: Typecheck
        continue-on-error: true
        run: npm run typecheck
      - id: validate
        name: Validate
        continue-on-error: true
        run: npm run validate
      - id: build
        name: Build
        continue-on-error: true
        run: npm run build
      - id: focused
        name: Focused Palace v15-v18 QA
        continue-on-error: true
        run: >
          node --experimental-strip-types --test
          tests/palace-d23-consumer-integration-v8.test.ts
          tests/palace-rich6-runtime-v15.test.ts
          tests/palace-player-facing-ui-v16.test.ts
          tests/palace-player-facing-ui-renderer-v16.test.ts
          tests/palace-prince-narrative-producer-v18.test.ts
          tests/palace-prince-narrative-renderer-v18.test.ts
          tests/chat3-secret-debt-separation-v2.test.ts
      - name: Aggregate exact-head verdict
        if: always()
        shell: cmd
        working-directory: .
        run: |
          echo typecheck=${{ steps.typecheck.outcome }}
          echo validate=${{ steps.validate.outcome }}
          echo build=${{ steps.build.outcome }}
          echo focused=${{ steps.focused.outcome }}
          if not "${{ steps.typecheck.outcome }}"=="success" exit /b 1
          if not "${{ steps.validate.outcome }}"=="success" exit /b 1
          if not "${{ steps.build.outcome }}"=="success" exit /b 1
          if not "${{ steps.focused.outcome }}"=="success" exit /b 1

  palace-v19-exact-head:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - name: Checkout exact v19 prose media head
        uses: actions/checkout@v4
        with:
          ref: 6cf19169b92fa709e8ae51cf73ff72ef2c0fac19
          fetch-depth: 1
      - name: Exact v19 SHA guard
        shell: cmd
        working-directory: .
        run: |
          for /f "delims=" %%i in ('git rev-parse HEAD') do set HEADSHA=%%i
          echo %HEADSHA%
          if not "%HEADSHA%"=="6cf19169b92fa709e8ae51cf73ff72ef2c0fac19" exit /b 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json
      - id: install
        name: npm ci
        run: npm ci
      - id: typecheck
        name: Typecheck
        continue-on-error: true
        run: npm run typecheck
      - id: validate
        name: Validate
        continue-on-error: true
        run: npm run validate
      - id: build
        name: Build
        continue-on-error: true
        run: npm run build
      - id: focused
        name: Focused Palace v18-v19 QA
        continue-on-error: true
        run: >
          node --experimental-strip-types --test
          tests/palace-prince-narrative-producer-v18.test.ts
          tests/palace-prince-narrative-renderer-v18.test.ts
          tests/palace-final-prose-media-v19.test.ts
      - name: Aggregate exact-head verdict
        if: always()
        shell: cmd
        working-directory: .
        run: |
          echo typecheck=${{ steps.typecheck.outcome }}
          echo validate=${{ steps.validate.outcome }}
          echo build=${{ steps.build.outcome }}
          echo focused=${{ steps.focused.outcome }}
          if not "${{ steps.typecheck.outcome }}"=="success" exit /b 1
          if not "${{ steps.validate.outcome }}"=="success" exit /b 1
          if not "${{ steps.build.outcome }}"=="success" exit /b 1
          if not "${{ steps.focused.outcome }}"=="success" exit /b 1
