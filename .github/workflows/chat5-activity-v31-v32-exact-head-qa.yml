name: Chat 5 Activity v31-v32 exact-head QA

on:
  workflow_dispatch:

jobs:
  regions-v15-diagnostics:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ab378d68765f7c9bbff43abf3b4b41e24df82e01
      - name: Exact SHA guard
        shell: cmd
        working-directory: .
        run: |
          for /f "delims=" %%i in ('git rev-parse HEAD') do set HEADSHA=%%i
          echo %HEADSHA%
          if not "%HEADSHA%"=="ab378d68765f7c9bbff43abf3b4b41e24df82e01" exit /b 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json
      - run: npm ci
      - name: Validate exact head
        run: npm run validate
      - name: Build exact head
        if: always()
        run: npm run build
      - name: Four-region Activity focused QA
        if: always()
        run: >
          node --experimental-strip-types --test
          tests/activity.test.ts
          tests/item-capability-activity-closure.test.ts
          tests/forest-frontier-production-hardening-v12.test.ts
          tests/trade-corridor-production-v13.test.ts
          tests/anomalous-reach-production-v14.test.ts
          tests/restricted-sites-production-v15.test.ts
          tests/qa-activity-option-reload.test.ts

  d38-mechanics-v16-diagnostics:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3cf69d7cb3df1a58d68908159d0acc14736435c4
      - name: Exact SHA guard
        shell: cmd
        working-directory: .
        run: |
          for /f "delims=" %%i in ('git rev-parse HEAD') do set HEADSHA=%%i
          echo %HEADSHA%
          if not "%HEADSHA%"=="3cf69d7cb3df1a58d68908159d0acc14736435c4" exit /b 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json
      - run: npm ci
      - name: Validate exact head
        run: npm run validate
      - name: Build exact head
        if: always()
        run: npm run build
      - name: D38 mechanics and explicit commit QA
        if: always()
        run: >
          node --experimental-strip-types --test
          tests/activity-ending-family-v16.test.ts
          tests/ending-meta.test.ts
          tests/restricted-sites-production-v15.test.ts

  d38-content-v17-diagnostics:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: df9ef5c3d04cfd8eb582c24838d971854e984218
      - name: Exact SHA guard
        shell: cmd
        working-directory: .
        run: |
          for /f "delims=" %%i in ('git rev-parse HEAD') do set HEADSHA=%%i
          echo %HEADSHA%
          if not "%HEADSHA%"=="df9ef5c3d04cfd8eb582c24838d971854e984218" exit /b 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json
      - run: npm ci
      - name: Validate exact head
        run: npm run validate
      - name: Build exact head
        if: always()
        run: npm run build
      - name: D38 RU EN content and presentation QA
        if: always()
        run: >
          node --experimental-strip-types --test
          tests/activity-ending-content-presentation-v17.test.ts
          tests/activity-ending-family-v16.test.ts
          tests/presentation-source-integrity-v9.test.ts
          tests/presentation-ending-parity-v9.test.ts
