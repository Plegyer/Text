name: Chat 5 Retired Tavern Cleanup v23 exact-head QA

on:
  push:
    branches:
      - chat5/qa-retired-tavern-cleanup-v23

jobs:
  focused:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - name: Checkout frozen Tavern cleanup producer
        uses: actions/checkout@v4
        with:
          ref: eb03a847347339ade109b0ec9022b81cd4abadaf
          fetch-depth: 1
      - name: Exact SHA guard
        shell: cmd
        working-directory: .
        run: |
          for /f "delims=" %%i in ('git rev-parse HEAD') do set HEADSHA=%%i
          echo %HEADSHA%
          if not "%HEADSHA%"=="eb03a847347339ade109b0ec9022b81cd4abadaf" exit /b 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json
      - name: Production firewall
        shell: cmd
        working-directory: .
        run: |
          git fetch --no-tags --depth=1 origin 36711bc8c9c5e8c2b99ffb8f8c861c462c414bca b37551d567d8017dbc25b87d66034af3e9c7a812
          node -e "const cp=require('node:child_process'); const seed='36711bc8c9c5e8c2b99ffb8f8c861c462c414bca', impl='b37551d567d8017dbc25b87d66034af3e9c7a812', head='eb03a847347339ade109b0ec9022b81cd4abadaf'; const out=(c)=>cp.execSync(c,{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean); const changed=out('git diff --name-only '+seed+' '+impl); console.log('Implementation delta:',changed); const expected=['mindy-successor/prior-work/astra/prototype-m3.2/content/localization.json','mindy-successor/prior-work/astra/prototype-m3.2/tests/retired-tavern-localization-cleanup-v31.test.ts']; if(changed.length!==2||expected.some(x=>!changed.includes(x))) process.exit(1); const post=out('git diff --name-only '+impl+' '+head+' -- mindy-successor/prior-work/astra/prototype-m3.2'); console.log('Post-implementation prototype delta:',post); if(post.length) process.exit(1);"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Validate
        run: npm run validate
      - name: Build
        run: npm run build
      - name: Tavern cleanup and D41 compatibility
        run: >
          node --experimental-strip-types --test
          tests/retired-tavern-localization-cleanup-v31.test.ts
          tests/advanced-endings-tranche-a-v11.test.ts
          tests/migration.test.ts
          tests/presentation-legacy-migration.test.ts
      - name: Presentation source-integrity adjacency
        run: >
          node --experimental-strip-types --test
          tests/presentation-ending-parity-v9.test.ts
          tests/presentation-source-integrity-v9.test.ts
          tests/chat3-tavern-live-authored-v15.test.ts
