name: Chat 6 v26 focused localization QA

on:
  workflow_dispatch:
  push:
    branches:
      - chat6/ending-localization-closure-producer-v26
    paths:
      - '.github/workflows/chat6-v26-focused.yml'

concurrency:
  group: chat6-v26-focused
  cancel-in-progress: false

jobs:
  focused:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - name: Checkout v26 producer exact head
        uses: actions/checkout@v4
        with:
          ref: d12ada2122ce5f6ad94a978d63eaab613ae51c19
          fetch-depth: 0

      - name: Verify exact checkout
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne 'd12ada2122ce5f6ad94a978d63eaab613ae51c19') {
            throw "Expected v26 producer SHA, got $actual"
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Focused localization tests
        run: >
          node --experimental-strip-types --test
          tests/ending-localization-closure-producer-v26.test.ts
          tests/localization.test.ts
          tests/ending-action-localization-production.test.ts
          tests/journal-outcome-localization.test.ts
          tests/generic-labels-localization-production-v1.test.ts
