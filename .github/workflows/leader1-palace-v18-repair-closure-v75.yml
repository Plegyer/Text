name: Leader1 Palace v18 repair closure v75

on:
  push:
    branches:
      - leader1/palace-v18-repair-closure-v75
    paths:
      - '.github/workflows/leader1-palace-v18-repair-closure-v75.yml'

permissions:
  contents: write

jobs:
  closure:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2

    steps:
      - name: Checkout exact closure source
        uses: actions/checkout@v4
        with:
          ref: 116b40651610a03c4d720bd8bafc7efbf17bb274
          fetch-depth: 1

      - name: Exact SHA guard
        shell: powershell
        run: |
          $expected = "116b40651610a03c4d720bd8bafc7efbf17bb274"
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "expected=$expected"
          Write-Host "actual=$actual"
          if ($actual -ne $expected) { throw "Exact closure source guard failed: $actual" }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Focused Palace v8 v15 v16 v18
        run: >
          node --experimental-strip-types --test
          tests/palace-d23-consumer-integration-v8.test.ts
          tests/palace-rich6-runtime-v15.test.ts
          tests/palace-player-facing-ui-v16.test.ts
          tests/palace-player-facing-ui-renderer-v16.test.ts
          tests/palace-prince-narrative-producer-v18.test.ts
          tests/palace-prince-narrative-renderer-v18.test.ts

      - name: Publish evidence
        shell: powershell
        working-directory: .
        run: |
          $evidencePath = "mindy-successor/docs/tasks/LEADER1_PALACE_V18_REPAIR_CLOSURE_RESULT_v75.json"
          $temp = Join-Path $env:RUNNER_TEMP "palace-v18-repair-closure-v75.json"
          $obj = [ordered]@{
            schemaVersion = 1
            id = "leader1.palace-v18-repair-closure.v75"
            status = "PASS"
            sourceSha = "116b40651610a03c4d720bd8bafc7efbf17bb274"
            chat4RepairSourceSha = "5a33f34ad0805d2a476f98ee45707ef93773a074"
            frozenBaseSha = "ed76c89829541c955e4129d6e0114c0d2fe7e562"
            checks = [ordered]@{
              typecheck = "PASS"
              validate = "PASS"
              build = "PASS"
              focusedPalace = "PASS"
            }
            focusedFiles = @(
              "tests/palace-d23-consumer-integration-v8.test.ts",
              "tests/palace-rich6-runtime-v15.test.ts",
              "tests/palace-player-facing-ui-v16.test.ts",
              "tests/palace-player-facing-ui-renderer-v16.test.ts",
              "tests/palace-prince-narrative-producer-v18.test.ts",
              "tests/palace-prince-narrative-renderer-v18.test.ts"
            )
            note = "Chat4 repair plus Leader test-only selector disambiguation; no production mechanics change."
            runId = "${{ github.run_id }}"
          }
          $obj | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 $temp
          git fetch origin leader1/palace-v18-repair-closure-v75
          git checkout -B leader1/palace-v18-repair-closure-v75 origin/leader1/palace-v18-repair-closure-v75
          Copy-Item $temp $evidencePath
          git config user.name "Leader1 QA"
          git config user.email "actions@users.noreply.github.com"
          git add $evidencePath
          git commit -m "qa(leader1): publish Palace v18 repair closure v75 evidence"
          git push origin HEAD:leader1/palace-v18-repair-closure-v75
