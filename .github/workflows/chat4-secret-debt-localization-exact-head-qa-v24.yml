name: Chat 4 Secret Debt localization exact-head QA v24

on:
  push:
    branches:
      - chat4/qa-secret-debt-localization-v24
    paths:
      - '.github/workflows/chat4-secret-debt-localization-exact-head-qa-v24.yml'

concurrency:
  group: chat4-secret-debt-localization-exact-head-qa-v24
  cancel-in-progress: true

jobs:
  exact-source-qa:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2

    steps:
      - name: Checkout exact frozen v27 producer
        uses: actions/checkout@v4
        with:
          ref: b6cc4ca6990936f4d801004806b25e4d920f9abf
          fetch-depth: 0

      - name: Verify exact v27 HEAD
        id: v27sha
        continue-on-error: true
        shell: cmd
        run: |
          for /f "delims=" %%i in ('git rev-parse HEAD') do set ACTUAL=%%i
          echo Exact frozen v27 producer: %ACTUAL%
          if not "%ACTUAL%"=="b6cc4ca6990936f4d801004806b25e4d920f9abf" exit /b 1

      - name: Verify v27 production firewall
        id: firewall
        continue-on-error: true
        shell: powershell
        run: |
          $base = '24b7bd0f7e6d4b06f606e5983b408e606d6704f2'
          $root = $env:GITHUB_WORKSPACE

          $changed = @(git -C $root diff --name-only $base HEAD)
          $changed | ForEach-Object { Write-Host $_ }

          $allowed = @(
            'mindy-successor/docs/tasks/CHAT6_SECRET_DEBT_ENDING_LOCALIZATION_PRODUCER_v27.md',
            'mindy-successor/prior-work/astra/prototype-m3.2/content/localization.json',
            'mindy-successor/prior-work/astra/prototype-m3.2/tests/secret-debt-ending-localization-producer-v27.test.ts'
          )

          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -ne 0) {
            Write-Error ("Unexpected v27 changed files: " + ($unexpected -join ', '))
            exit 1
          }

          git -C $root diff --exit-code $base HEAD -- `
            mindy-successor/prior-work/astra/prototype-m3.2/src `
            mindy-successor/prior-work/astra/prototype-m3.2/content/definitions.json `
            mindy-successor/prior-work/astra/prototype-m3.2/content/packs `
            mindy-successor/prior-work/astra/prototype-m3.2/content/presentation.json

          if ($LASTEXITCODE -ne 0) {
            Write-Error 'v27 changed production runtime/mechanics/content outside localization.'
            exit 1
          }

      - name: Setup Node for v27
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json

      - name: Install v27 dependencies
        id: v27install
        continue-on-error: true
        run: npm ci

      - name: v27 typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: v27 validate
        id: validate
        continue-on-error: true
        run: npm run validate

      - name: v27 build
        id: build
        continue-on-error: true
        run: npm run build

      - name: v27 localization focused and runtime-key adjacency
        id: v27tests
        continue-on-error: true
        run: >
          node --experimental-strip-types --test
          tests/secret-debt-ending-localization-producer-v27.test.ts
          tests/localization.test.ts
          tests/ending-action-localization-production.test.ts
          tests/journal-outcome-localization.test.ts
          tests/generic-labels-localization-production-v1.test.ts

      - name: Checkout exact frozen v12 mechanics authority
        uses: actions/checkout@v4
        with:
          ref: 10a2ecebf02ce64bdaf54d74dbbb66d6bae6e59e
          fetch-depth: 1
          clean: true

      - name: Verify exact v12 HEAD
        id: v12sha
        continue-on-error: true
        shell: cmd
        run: |
          for /f "delims=" %%i in ('git rev-parse HEAD') do set ACTUAL=%%i
          echo Exact frozen v12 mechanics authority: %ACTUAL%
          if not "%ACTUAL%"=="10a2ecebf02ce64bdaf54d74dbbb66d6bae6e59e" exit /b 1

      - name: Setup Node for v12
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json

      - name: Install v12 dependencies
        id: v12install
        continue-on-error: true
        run: npm ci

      - name: v12 Secret Debt route and ordinary Prostitute separation
        id: v12tests
        continue-on-error: true
        run: >
          node --experimental-strip-types --test
          tests/secret-debt-full-route-v12.test.ts
          tests/prostitute-boundaries.test.ts

      - name: Required-check gate
        if: always()
        shell: powershell
        run: |
          Write-Host "v27sha=${{ steps.v27sha.outcome }}"
          Write-Host "firewall=${{ steps.firewall.outcome }}"
          Write-Host "v27install=${{ steps.v27install.outcome }}"
          Write-Host "typecheck=${{ steps.typecheck.outcome }}"
          Write-Host "validate=${{ steps.validate.outcome }}"
          Write-Host "build=${{ steps.build.outcome }}"
          Write-Host "v27tests=${{ steps.v27tests.outcome }}"
          Write-Host "v12sha=${{ steps.v12sha.outcome }}"
          Write-Host "v12install=${{ steps.v12install.outcome }}"
          Write-Host "v12tests=${{ steps.v12tests.outcome }}"

          $required = @(
            '${{ steps.v27sha.outcome }}',
            '${{ steps.firewall.outcome }}',
            '${{ steps.v27install.outcome }}',
            '${{ steps.typecheck.outcome }}',
            '${{ steps.validate.outcome }}',
            '${{ steps.build.outcome }}',
            '${{ steps.v27tests.outcome }}',
            '${{ steps.v12sha.outcome }}',
            '${{ steps.v12install.outcome }}',
            '${{ steps.v12tests.outcome }}'
          )

          if ($required -contains 'failure' -or $required -contains 'cancelled') {
            exit 1
          }
