name: Leader1 Stage2 full CI v101
on:
  push:
    branches: [qa-stage2-full-v101]
permissions:
  contents: read
jobs:
  full-ci:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3ec5d3eb4254a2723982825fce3f00d03e770d63
          fetch-depth: 1
      - name: Exact SHA guard
        shell: powershell
        run: |
          if((git rev-parse HEAD).Trim() -ne "3ec5d3eb4254a2723982825fce3f00d03e770d63"){throw "wrong source"}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: npm ci
      - run: npm run check
