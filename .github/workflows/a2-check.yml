name: A2 Condition Effect Check

on:
  push:
    branches:
      - a2-condition-effect-v2
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json
      - run: npm ci
      - run: npm run check
