name: Chat 4 Secret Debt v12 focused check

on:
  pull_request:
    paths:
      - 'mindy-successor/prior-work/astra/prototype-m3.2/**'
      - '.github/workflows/chat4-secret-debt-v12-focused.yml'

concurrency:
  group: chat4-secret-debt-v12-focused
  cancel-in-progress: true

jobs:
  focused:
    if: startsWith(github.head_ref, 'chat4/secret-debt-full-route-producer-v12-focused-check')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - name: Checkout verification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Validate
        run: npm run validate
      - name: Build
        run: npm run build
      - name: Secret Debt focused regressions
        run: >
          node --experimental-strip-types --test
          tests/secret-debt-full-route-v12.test.ts
          tests/night-flow.test.ts
          tests/ending-meta.test.ts
          tests/palace-d23-consumer-integration-v8.test.ts
          tests/activity.test.ts
          tests/school-engine-adapter.test.ts
          tests/ordinary-hard-work-meta-production.test.ts
