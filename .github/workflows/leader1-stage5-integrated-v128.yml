name: Leader1 Stage5 integrated exact-source full CI v128
on:
  push:
    branches: [qa-stage5-leader-full-v128]
permissions:
  contents: read
jobs:
  stage5:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 95
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fb841ee1742a515a4e5cbfddf99ef89a5fc9cbd3
          fetch-depth: 1
      - name: Exact source guard
        shell: powershell
        run: |
          if((git rev-parse HEAD).Trim() -ne "fb841ee1742a515a4e5cbfddf99ef89a5fc9cbd3"){throw "wrong source SHA"}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Restore immutable golden bytes from exact commit
        shell: powershell
        run: |
          node -e "const fs=require('node:fs');const cp=require('node:child_process');const p=['mindy-successor/prior-work/astra/prototype-m3.2/tests/fixtures/final-player-facing-golden-v54.json','mindy-successor/prior-work/astra/prototype-m3.2/tests/final-player-facing-golden-manifest-v55.test.ts','mindy-successor/prior-work/astra/prototype-m3.2/tests/fixtures/final-ui-accessibility-smoke-v60.json','mindy-successor/prior-work/astra/prototype-m3.2/tests/fixtures/final-save-migration-golden-v57.json','mindy-successor/docs/tasks/CHAT4_D46_D47_LEGACY_GOLDEN_OPERATIONS_v53.json','mindy-successor/docs/tasks/CHAT4_D46_D47_LEGACY_GOLDEN_GATE_v54.json'];for(const x of p){const b=cp.execFileSync('git',['-C',process.env.GITHUB_WORKSPACE,'show','HEAD:'+x]);fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/'+x,b);console.log('ORIGINAL_BLOB',x,b.length)}"
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Validate
        run: npm run validate
      - name: Build
        run: npm run build
      - name: Stage5 final strict RU EN release target and cross contracts
        shell: powershell
        run: |
          $env:FINAL_PLAYER_FACING_GOLDEN_TARGET="1"
          $env:FINAL_UI_ACCESSIBILITY_SMOKE_TARGET="1"
          $env:FINAL_PLAYER_FACING_CROSS_CONTRACT_TARGET="1"
          node --experimental-strip-types --test tests/final-player-facing-golden-release-target-stage5-v1.test.ts tests/final-ui-accessibility-smoke-v61.test.ts tests/final-player-facing-cross-contract-v64.test.ts
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Stage5 executable 23 case migration plus 15 historical package
        run: node --experimental-strip-types --test tests/final-save-migration-closure-v21.test.ts tests/final-historical-fixtures-v55.test.ts tests/final-save-migration-golden-v57.test.ts
      - name: Stage4 32-golden focused prerequisite suites
        run: node --experimental-strip-types --test tests/economy-start-balance-v14.test.ts tests/hard-work-bonus-mapping-v13.test.ts tests/ordinary-hard-work-meta-production.test.ts tests/ordinary-hard-work-lifecycle-parity.test.ts tests/lumber-hard-work-invariant.test.ts tests/hard-work-stat-cap-d24.test.ts tests/hard-work-meta-migration-v5.test.ts tests/migration.test.ts tests/ending-meta.test.ts tests/qa-exactly-once-reload.test.ts tests/qa-one-save-state-drift-sentinel-v2.test.ts tests/lumber-stay-retirement-v17.test.ts tests/presentation-ending-parity-v9.test.ts tests/strong-meta-registry-v7.test.ts tests/strong-meta-engine-integration-v7.test.ts tests/secret-debt-full-route-v12.test.ts tests/secret-debt-activity-energy-compat-v20.test.ts tests/activity.test.ts tests/night-flow.test.ts tests/localization.test.ts tests/presentation-source-integrity-v9.test.ts tests/presentation-locale-accessibility-v9.test.ts
      - name: Full check
        run: npm run check
