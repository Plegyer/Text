name: Leader1 Chat2 Stage1 Full CI Diagnostics v61

on:
  push:
    branches:
      - leader1/chat2-stage1-full-ci-v60
    paths:
      - '.github/workflows/leader1-chat2-stage1-full-ci-diagnostics-v61.yml'

permissions:
  contents: write

jobs:
  diagnose-tests:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 63e28896260887ed753b7fba0ea29949d73c2ebb
          fetch-depth: 1
      - name: Exact SHA guard
        shell: powershell
        run: |
          $expected="63e28896260887ed753b7fba0ea29949d73c2ebb"
          $actual=(git rev-parse HEAD).Trim()
          if($actual -ne $expected){throw "Exact-source guard failed: $actual"}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json
      - name: npm ci
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
        run: npm ci
      - name: Capture npm test
        id: tests
        continue-on-error: true
        shell: powershell
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
        run: |
          npm test *>&1 | Tee-Object "$env:RUNNER_TEMP\full-ci-tests-v61.log"
          exit $LASTEXITCODE
      - name: Checkout evidence branch
        if: always()
        uses: actions/checkout@v4
        with:
          ref: leader1/chat2-stage1-full-ci-v60
          path: evidence-repo
          persist-credentials: true
      - name: Publish diagnostic log
        if: always()
        shell: powershell
        run: |
          $base="evidence-repo/mindy-successor/docs/tasks"
          Copy-Item "$env:RUNNER_TEMP\full-ci-tests-v61.log" "$base/CHAT2_STAGE1_FULL_CI_TESTS_v61.log" -Force
          $summary=[ordered]@{
            testedSha="63e28896260887ed753b7fba0ea29949d73c2ebb"
            npmTest="${{ steps.tests.outcome }}"
          }
          $summary|ConvertTo-Json|Set-Content -Encoding UTF8 "$base/CHAT2_STAGE1_FULL_CI_DIAGNOSTIC_v61.json"
          Set-Location evidence-repo
          git config user.name "Leader1 QA"
          git config user.email "leader1-qa@users.noreply.github.com"
          git add mindy-successor/docs/tasks/CHAT2_STAGE1_FULL_CI_TESTS_v61.log mindy-successor/docs/tasks/CHAT2_STAGE1_FULL_CI_DIAGNOSTIC_v61.json
          git commit -m "qa(chat2): publish Stage1 full CI diagnostics v61"
          git push origin HEAD:leader1/chat2-stage1-full-ci-v60
