name: Leader1 Palace v18 frozen v16 baseline probe v74

on:
  push:
    branches:
      - leader1/palace-v18-frozen-v16-baseline-probe-v74
    paths:
      - '.github/workflows/leader1-palace-v18-frozen-v16-baseline-probe-v74.yml'

jobs:
  baseline-v16-renderer:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2

    steps:
      - name: Checkout exact capability-only Palace v18 repair
        uses: actions/checkout@v4
        with:
          ref: 20f194b93bfd458300f81f9ef7bb1cd850102c7c
          fetch-depth: 1

      - name: Exact SHA guard
        shell: powershell
        run: |
          $expected = "20f194b93bfd458300f81f9ef7bb1cd850102c7c"
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "expected=$expected"
          Write-Host "actual=$actual"
          if ($actual -ne $expected) { throw "Exact capability-only guard failed: $actual" }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Build
        run: npm run build

      - name: Capability-only v16 renderer probe
        run: node --experimental-strip-types --test tests/palace-player-facing-ui-renderer-v16.test.ts
