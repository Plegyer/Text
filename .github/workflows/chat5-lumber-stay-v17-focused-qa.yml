name: Chat5 lumber-stay v17 focused QA

on:
  push:
    branches:
      - chat5/lumber-stay-v17-focused-qa-20261004
    paths:
      - '.github/workflows/chat5-lumber-stay-v17-focused-qa.yml'

permissions:
  contents: read

jobs:
  focused-qa:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - name: Checkout exact producer head
        uses: actions/checkout@v4
        with:
          ref: 39912e7435c3707d98f96fe550d697c20ac0bedb
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Validate
        run: npm run validate
      - name: Build
        run: npm run build
      - name: Lumber-stay v17 acceptance
        run: node --experimental-strip-types --test tests/lumber-stay-retirement-v17.test.ts
      - name: Ending migration and RunResult adjacency
        run: node --experimental-strip-types --test tests/ending-meta.test.ts tests/migration.test.ts tests/advanced-endings-tranche-a-v11.test.ts
      - name: Save-load, profile dedupe, retired presentation inventory
        run: node --experimental-strip-types --test tests/lumber-stay-retirement-v17.test.ts tests/presentation-source-integrity-v9.test.ts tests/presentation-ending-parity-v9.test.ts
      - name: Strong Meta, Palace, Hard Work, Secret Debt isolation
        run: node --experimental-strip-types --test tests/strong-meta-engine-integration-v7.test.ts tests/hard-work-palace-meta-smoke.test.ts tests/hard-work-meta-migration-v5.test.ts tests/chat3-secret-debt-separation-v2.test.ts
