name: Leader1 keyboard focus fixed v100
on:
  push:
    branches: [qa-keyboard-focus-fixed-v100]
permissions:
  contents: read
jobs:
  isolated:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d72ba1c3395e72d938a1f4057cd5d9c0b4c50334
          fetch-depth: 1
      - name: Exact SHA guard
        shell: powershell
        run: |
          if((git rev-parse HEAD).Trim() -ne "d72ba1c3395e72d938a1f4057cd5d9c0b4c50334"){throw "wrong source"}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: npm ci
      - run: npm run build
      - run: node --experimental-strip-types --test tests/presentation-keyboard-focus-v9.test.ts
