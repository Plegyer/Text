name: Chat 3 D51 exact-head QA v21

on:
  push:
    branches:
      - chat3/qa-secret-debt-activity-energy-compat-v21

defaults:
  run:
    working-directory: mindy-successor/prior-work/astra/prototype-m3.2

jobs:
  exact-head-focused:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout frozen D51 producer
        uses: actions/checkout@v4
        with:
          ref: 79a868bf30af2c162b2ea1323759dffad5e8dadf

      - name: Verify exact frozen head
        shell: powershell
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne '79a868bf30af2c162b2ea1323759dffad5e8dadf') {
            throw "Expected frozen producer 79a868bf30af2c162b2ea1323759dffad5e8dadf, got $head"
          }

      - name: Apply QA-only v20 fixture corrections
        shell: powershell
        run: |
          $path = 'tests/secret-debt-activity-energy-compat-v20.test.ts'
          $text = Get-Content $path -Raw

          $pattern = "    lastLenderAttemptDay:null\r?\n  \};\r?\n  return s;"
          $replacement = @"
              lastLenderAttemptDay:null
            };
            s.run.historyState.eventHistory['secret-debt.trap-activation']={
              count:1,lastDay:day,variants:{default:day}
            };
            return s;
          "@
          $regex = [regex]::new($pattern)
          $patched = $regex.Replace($text,$replacement,1)
          if ($patched -eq $text) {
            throw 'Failed to patch setBound trap-activation history fixture.'
          }

          $patched2 = $patched.Replace(
            'assert.equal(s.run.secretDebt.boundDay,1);',
            'assert.equal(s.run.secretDebt.boundDay,10);'
          )
          if ($patched2 -eq $patched) {
            throw 'Failed to patch exact D19 boundDay expectation.'
          }

          Set-Content -Path $path -Value $patched2 -Encoding UTF8

      - name: Verify production worktree remains frozen
        shell: powershell
        run: |
          git diff --exit-code -- src/core content
          if ($LASTEXITCODE -ne 0) {
            throw 'QA overlay modified production files.'
          }

      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate
        run: npm run validate

      - name: Build
        run: npm run build

      - name: D51 exact-head focused regressions
        run: >
          node --experimental-strip-types --test
          tests/secret-debt-activity-energy-compat-v20.test.ts
          tests/secret-debt-full-route-v12.test.ts
          tests/night-flow.test.ts
          tests/activity.test.ts
