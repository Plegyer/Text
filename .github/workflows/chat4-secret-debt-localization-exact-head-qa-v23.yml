name: Chat 4 Secret Debt localization exact-head QA v23

on:
  push:
    branches:
      - chat4/qa-secret-debt-localization-v23
    paths:
      - '.github/workflows/chat4-secret-debt-localization-exact-head-qa-v23.yml'

concurrency:
  group: chat4-secret-debt-localization-exact-head-qa-v23
  cancel-in-progress: true

jobs:
  exact-head-localization:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - name: Checkout frozen v27 producer
        uses: actions/checkout@v4
        with:
          ref: b6cc4ca6990936f4d801004806b25e4d920f9abf
          fetch-depth: 0

      - name: Verify exact v27 HEAD
        shell: cmd
        run: |
          for /f "delims=" %%i in ('git rev-parse HEAD') do set ACTUAL=%%i
          if not "%ACTUAL%"=="b6cc4ca6990936f4d801004806b25e4d920f9abf" exit /b 1
          echo Exact frozen v27 producer: %ACTUAL%

      - name: Verify localization-only production firewall
        shell: pwsh
        run: |
          $base = '24b7bd0f7e6d4b06f606e5983b408e606d6704f2'
          $changed = git diff --name-only $base HEAD
          $changed | ForEach-Object { Write-Host $_ }

          $allowed = @(
            'mindy-successor/docs/tasks/CHAT6_SECRET_DEBT_ENDING_LOCALIZATION_PRODUCER_v27.md',
            'mindy-successor/prior-work/astra/prototype-m3.2/content/localization.json',
            'mindy-successor/prior-work/astra/prototype-m3.2/tests/secret-debt-ending-localization-producer-v27.test.ts'
          )

          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -ne 0) {
            Write-Error ("Unexpected v27 changed files: " + ($unexpected -join ', '))
            exit 1
          }

          git diff --exit-code $base HEAD -- src content/definitions.json content/packs content/presentation.json
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'Production runtime/mechanics/content changed in v27.'
            exit 1
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Secret Debt v27 localization and runtime-key coverage
        run: >
          node --experimental-strip-types --test
          tests/secret-debt-ending-localization-producer-v27.test.ts
          tests/localization.test.ts
          tests/ending-action-localization-production.test.ts
          tests/journal-outcome-localization.test.ts
          tests/generic-labels-localization-production-v1.test.ts

  frozen-v12-route-adjacency:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - name: Checkout frozen Secret Debt v12 mechanics authority
        uses: actions/checkout@v4
        with:
          ref: 10a2ecebf02ce64bdaf54d74dbbb66d6bae6e59e
          fetch-depth: 1

      - name: Verify exact v12 HEAD
        shell: cmd
        run: |
          for /f "delims=" %%i in ('git rev-parse HEAD') do set ACTUAL=%%i
          if not "%ACTUAL%"=="10a2ecebf02ce64bdaf54d74dbbb66d6bae6e59e" exit /b 1
          echo Exact frozen v12 mechanics authority: %ACTUAL%

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Secret Debt v12 focused route tests
        run: >
          node --experimental-strip-types --test
          tests/secret-debt-full-route-v12.test.ts
          tests/chat3-secret-debt-separation-v2.test.ts
