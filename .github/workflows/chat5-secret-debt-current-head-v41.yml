name: Chat 5 Secret Debt current-head v41 exact QA

on:
  push:
    branches:
      - chat5/qa-secret-debt-current-head-v40

jobs:
  exact-head:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout frozen Chat2 head
        uses: actions/checkout@v4
        with:
          ref: a02d4931087e0884756a6888354b8a69e0327b02
          fetch-depth: 1
      - name: Exact SHA guard
        shell: cmd
        run: |
          for /f "delims=" %%i in ('git rev-parse HEAD') do set HEADSHA=%%i
          echo %HEADSHA%
          if not "%HEADSHA%"=="a02d4931087e0884756a6888354b8a69e0327b02" exit /b 1
      - name: Frozen tree inventory
        shell: cmd
        run: |
          git ls-tree -r --name-only HEAD
          echo ===== project package check =====
          if exist mindy-successor\prior-work\astra\prototype-m3.2\package.json (echo package.json PRESENT) else (echo package.json MISSING)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: npm ci diagnostic
        continue-on-error: true
        shell: cmd
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
        run: npm ci
      - name: typecheck diagnostic
        if: always()
        continue-on-error: true
        shell: cmd
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
        run: npm run typecheck
      - name: validate diagnostic
        if: always()
        continue-on-error: true
        shell: cmd
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
        run: npm run validate
      - name: build diagnostic
        if: always()
        continue-on-error: true
        shell: cmd
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
        run: npm run build
      - name: Focused Secret Debt files diagnostic
        if: always()
        continue-on-error: true
        shell: cmd
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
        run: >
          node --experimental-strip-types --test
          tests/secret-debt-full-route-v12.test.ts
          tests/secret-debt-activity-energy-compat-v20.test.ts
          tests/secret-debt-ending-localization-producer-v27.test.ts
      - name: Required final focused roster inventory
        if: always()
        shell: cmd
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
        run: |
          for %%f in (
            tests\secret-debt-full-route-v12.test.ts
            tests\secret-debt-activity-energy-compat-v20.test.ts
            tests\secret-debt-ending-localization-producer-v27.test.ts
            tests\prostitute-boundaries.test.ts
            tests\night-flow.test.ts
            tests\night-content-gap-v10.test.ts
            tests\qa-exactly-once-reload.test.ts
            tests\shared-night-ui-localization-production-v1.test.ts
            tests\activity.test.ts
            tests\school-night-study-adapter.test.ts
            tests\strong-meta-d30-runtime-v7.test.ts
            tests\strong-meta-engine-integration-v7.test.ts
            tests\strong-meta-registry-v7.test.ts
            tests\ending-meta.test.ts
            tests\ordinary-hard-work-meta-production.test.ts
            tests\palace-d23-consumer-integration-v8.test.ts
            tests\hard-work-palace-meta-smoke.test.ts
            tests\qa-one-save-state-drift-sentinel-v2.test.ts
            tests\localization.test.ts
            tests\presentation-source-integrity-v9.test.ts
            tests\presentation-locale-accessibility-v9.test.ts
          ) do @if exist %%f (echo PRESENT %%f) else (echo MISSING %%f)
