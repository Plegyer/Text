name: Chat 4 Night v10 focused check

on:
  pull_request:
    paths:
      - 'mindy-successor/prior-work/astra/prototype-m3.2/**'
      - '.github/workflows/chat4-night-v10-focused.yml'

jobs:
  focused:
    if: startsWith(github.head_ref, 'chat4/night-content-gap-producer-v10-focused-check')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - name: Checkout exact producer head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Validate
        run: npm run validate
      - name: Build
        run: npm run build
      - name: D42 and existing Night focused regressions
        run: >
          node --experimental-strip-types --test
          tests/night-content-gap-v10.test.ts
          tests/night-flow.test.ts
          tests/lumber-night-acceptance.test.ts
          tests/satyr-maid-night-presentation-c2-125.test.ts
          tests/satyr-maid-relationship-night.test.ts
          tests/school-generic-night-v7-parity.test.ts
          tests/school-hunter-v15-night-parity.test.ts
          tests/school-night-study-adapter.test.ts
          tests/school-satyr-v12-night-parity.test.ts
          tests/school-tavern-v14-night-parity.test.ts
          tests/school-undead-v13-night-parity.test.ts
          tests/shared-night-ui-localization-production-v1.test.ts
