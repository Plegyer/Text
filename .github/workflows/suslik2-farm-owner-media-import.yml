name: SUSLIK 2 — publish fifth-shift owner media

on:
  push:
    branches:
      - 'suslik-2/farm-owner-meeting-20261016'
    paths:
      - '.github/workflows/suslik2-farm-owner-media-import.yml'
      - 'suslik-2/FARM_OWNER_MEDIA_IMPORT_TRIGGER.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: suslik2-farm-owner-media-import
  cancel-in-progress: false

jobs:
  publish-farm-owner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete feature code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Create draft for the original PNG if missing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: suslik2-farm-owner-05-20261016
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target 'suslik-2/farm-owner-meeting-20261016' \
              --title 'SUSLIK 2 — Zombie Farm Owner Meeting — 2026-10-16' \
              --notes 'Original author-approved fifth-shift encounter PNG. Upload undecoded file named undead-farm-owner-05.png, SHA256 493dd3ce9fd1c1fe73fb513e2cf97156e113874b2db4aa92c1d70c99be9a1f13, then publish the release. The workflow checks the image and game tests before fast-forward publication to the portable-canonical branch.' \
              --draft
          fi

      - name: Check required asset by exact name
        id: media
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: suslik2-farm-owner-05-20261016
        shell: bash
        run: |
          set -euo pipefail
          present=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | grep -Fx 'undead-farm-owner-05.png' || true)
          if [[ "$present" == 'undead-farm-owner-05.png' ]]; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            echo 'found=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Author PNG is still pending; do not publish broken game scene.'
          fi

      - name: Download and authenticate exact original media
        if: steps.media.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: suslik2-farm-owner-05-20261016
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/owner-05"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'undead-farm-owner-05.png' \
            --dir "$RUNNER_TEMP/owner-05"
          test "$(stat -c %s "$RUNNER_TEMP/owner-05/undead-farm-owner-05.png")" -eq 3475661
          printf '%s  %s\n' '493dd3ce9fd1c1fe73fb513e2cf97156e113874b2db4aa92c1d70c99be9a1f13' \
            "$RUNNER_TEMP/owner-05/undead-farm-owner-05.png" | sha256sum -c -

      - name: Setup Node.js
        if: steps.media.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test existing feature scene
        if: steps.media.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd suslik-2
          npm test > "$RUNNER_TEMP/feature-tests.log" 2>&1
          tail -18 "$RUNNER_TEMP/feature-tests.log"
          grep -q '^# fail 0$' "$RUNNER_TEMP/feature-tests.log"

      - name: Safely add only original PNG to latest canonical branch
        if: steps.media.outputs.found == 'true'
        env:
          TARGET_BRANCH: suslik-2/portable-canonical-20261015
          EXPECTED_SHA256: 493dd3ce9fd1c1fe73fb513e2cf97156e113874b2db4aa92c1d70c99be9a1f13
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git switch --detach "origin/$TARGET_BRANCH"
          # Canonical already contains the reviewed fifth-shift scene.
          # Do not revert any newer commits from that branch.
          grep -Fq 'sceneUndeadFarmOwner05' suslik-2/gameplay-ui.js
          grep -Fq 'undead-farm-owner-05.png' suslik-2/gameplay-content.js
          grep -Fq 'undead-farm-owner-05' suslik-2/content/scenes.json
          mkdir -p suslik-2/assets/events
          cp "$RUNNER_TEMP/owner-05/undead-farm-owner-05.png" \
            suslik-2/assets/events/undead-farm-owner-05.png
          printf '%s  %s\n' "$EXPECTED_SHA256" \
            'suslik-2/assets/events/undead-farm-owner-05.png' | sha256sum -c -
          cd suslik-2
          npm test > "$RUNNER_TEMP/canonical-tests.log" 2>&1
          tail -18 "$RUNNER_TEMP/canonical-tests.log"
          grep -q '^# fail 0$' "$RUNNER_TEMP/canonical-tests.log"
          cd ..
          git add -- suslik-2/assets/events/undead-farm-owner-05.png
          if git diff --cached --quiet; then
            echo 'Exact image is already published on canonical.'
          else
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'assets(suslik-2): publish verified original zombie-farm owner PNG'
            # Non-force push: rejects concurrent canonical changes.
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
          echo "Canonical original owner PNG published at commit $(git rev-parse HEAD)"
