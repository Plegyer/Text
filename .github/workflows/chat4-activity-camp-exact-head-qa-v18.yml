name: Chat 4 Activity Camp exact-head QA v18

on:
  push:
    branches:
      - chat4/qa-activity-camp-persistence-v18
    paths:
      - '.github/workflows/chat4-activity-camp-exact-head-qa-v18.yml'
  pull_request:
    branches:
      - chat4/activity-camp-persistence-producer-v17
    paths:
      - '.github/workflows/chat4-activity-camp-exact-head-qa-v18.yml'

concurrency:
  group: chat4-activity-camp-exact-head-qa-v18
  cancel-in-progress: true

jobs:
  exact-head-qa:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - name: Checkout frozen Camp producer
        uses: actions/checkout@v4
        with:
          ref: 0cae33dd3518dbda7d6d84e4ea6661b02fe49886
          fetch-depth: 1

      - name: Verify exact HEAD
        shell: cmd
        run: |
          for /f "delims=" %%i in ('git rev-parse HEAD') do set ACTUAL=%%i
          if not "%ACTUAL%"=="0cae33dd3518dbda7d6d84e4ea6661b02fe49886" exit /b 1
          echo Exact frozen producer: %ACTUAL%

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Validate
        id: validate
        continue-on-error: true
        run: npm run validate

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Focused Activity Camp adjacency tests
        id: focused
        continue-on-error: true
        run: >
          node --experimental-strip-types --test
          tests/activity-camp-persistence-v17.test.ts
          tests/activity.test.ts
          tests/qa-activity-option-reload.test.ts
          tests/qa-exactly-once-reload.test.ts
          tests/migration.test.ts
          tests/night-flow.test.ts
          tests/restricted-sites-production-v15.test.ts
          tests/trade-corridor-production-v13.test.ts
          tests/anomalous-reach-production-v14.test.ts

      - name: Required-check gate
        if: always()
        shell: cmd
        run: |
          echo typecheck=${{ steps.typecheck.outcome }}
          echo validate=${{ steps.validate.outcome }}
          echo build=${{ steps.build.outcome }}
          echo focused=${{ steps.focused.outcome }}
          if not "${{ steps.typecheck.outcome }}"=="success" exit /b 1
          if not "${{ steps.validate.outcome }}"=="success" exit /b 1
          if not "${{ steps.build.outcome }}"=="success" exit /b 1
          if not "${{ steps.focused.outcome }}"=="success" exit /b 1
