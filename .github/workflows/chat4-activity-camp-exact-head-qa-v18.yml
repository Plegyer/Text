name: Chat 4 Activity Camp exact-head QA v18

on:
  push:
    branches:
      - chat4/qa-activity-camp-persistence-v18
    paths:
      - '.github/workflows/chat4-activity-camp-exact-head-qa-v18.yml'
  pull_request:
    branches:
      - chat4/activity-camp-persistence-producer-v17
    paths:
      - '.github/workflows/chat4-activity-camp-exact-head-qa-v18.yml'

concurrency:
  group: chat4-activity-camp-exact-head-qa-v18
  cancel-in-progress: false

jobs:
  exact-head-qa:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - name: Checkout frozen Camp producer
        uses: actions/checkout@v4
        with:
          ref: 0cae33dd3518dbda7d6d84e4ea6661b02fe49886
          fetch-depth: 1

      - name: Verify exact HEAD
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne '0cae33dd3518dbda7d6d84e4ea6661b02fe49886') {
            throw "Expected frozen Camp producer 0cae33dd3518dbda7d6d84e4ea6661b02fe49886, got $actual"
          }
          Write-Host "Exact frozen producer: $actual"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Focused Activity Camp adjacency tests
        run: >
          node --experimental-strip-types --test
          tests/activity-camp-persistence-v17.test.ts
          tests/activity.test.ts
          tests/qa-activity-option-reload.test.ts
          tests/qa-exactly-once-reload.test.ts
          tests/migration.test.ts
          tests/night-flow.test.ts
          tests/restricted-sites-production-v15.test.ts
          tests/trade-corridor-production-v13.test.ts
          tests/anomalous-reach-production-v14.test.ts
