name: Leader1 Strong Meta UI closure v92
on:
  push:
    branches: [qa-strong-meta-ui-v92]
permissions:
  contents: read
jobs:
  gate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5c1cecf31c9d7ac240bb96e4701ec6818e6830a4
          fetch-depth: 1
      - name: Exact SHA guard
        shell: powershell
        run: |
          if((git rev-parse HEAD).Trim() -ne "5c1cecf31c9d7ac240bb96e4701ec6818e6830a4"){throw "wrong source"}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate
      - run: npm run build
      - name: Focused Strong Meta UI and adjacency
        run: >
          node --experimental-strip-types --test
          tests/strong-meta-player-ui-v42.test.ts
          tests/strong-meta-ui-localization-v42-v43.test.ts
          tests/modal-aria-localization-v43.test.ts
          tests/strong-meta-engine-integration-v7.test.ts
          tests/strong-meta-registry-v7.test.ts
          tests/strong-meta-d30-runtime-v7.test.ts
          tests/d39-formal-introduction-assassin-v46.test.ts
          tests/school-life-content-reload.test.ts
          tests/palace-player-facing-ui-v16.test.ts
          tests/palace-player-facing-ui-renderer-v16.test.ts
          tests/palace-prince-narrative-renderer-v18.test.ts
          tests/palace-final-prose-media-v19.test.ts
