name: Leader1 Stage5 accepted-source focus and full diagnostic v128
on:
  push:
    branches: [qa-stage5-integrated-focus-v128]
permissions:
  contents: read
jobs:
  stage5:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 62e9fbc2c46818483a1cafd1360d3910413c5e51
          fetch-depth: 1
      - name: Exact source SHA guard
        shell: powershell
        run: |
          if((git rev-parse HEAD).Trim() -ne "62e9fbc2c46818483a1cafd1360d3910413c5e51"){throw "wrong source SHA"}
      - name: Preserve pinned original Golden source blob bytes
        shell: powershell
        run: |
          node -e "const fs=require('node:fs');const cp=require('node:child_process');const p=['mindy-successor/prior-work/astra/prototype-m3.2/tests/fixtures/final-player-facing-golden-v54.json','mindy-successor/prior-work/astra/prototype-m3.2/tests/final-player-facing-golden-manifest-v55.test.ts','mindy-successor/prior-work/astra/prototype-m3.2/tests/fixtures/final-ui-accessibility-smoke-v60.json','mindy-successor/prior-work/astra/prototype-m3.2/tests/fixtures/final-save-migration-golden-v57.json','mindy-successor/docs/tasks/CHAT4_D46_D47_LEGACY_GOLDEN_OPERATIONS_v53.json','mindy-successor/docs/tasks/CHAT4_D46_D47_LEGACY_GOLDEN_GATE_v54.json'];for(const x of p){fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/'+x,cp.execFileSync('git',['-C',process.env.GITHUB_WORKSPACE,'show','HEAD:'+x]))}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Validate
        run: npm run validate
      - name: Build
        run: npm run build
      - name: Save Golden integrity and frozen original validator
        run: node --experimental-strip-types --test tests/final-historical-fixtures-v55.test.ts tests/final-save-migration-golden-v57.test.ts tests/final-player-facing-golden-manifest-v55.test.ts
      - name: Final player-facing RU EN Golden smoke cross contract
        shell: powershell
        run: |
          $env:FINAL_PLAYER_FACING_GOLDEN_TARGET="1"
          $env:FINAL_UI_ACCESSIBILITY_SMOKE_TARGET="1"
          $env:FINAL_PLAYER_FACING_CROSS_CONTRACT_TARGET="1"
          node --experimental-strip-types --test tests/final-player-facing-golden-release-target-stage5-v1.test.ts tests/final-ui-accessibility-smoke-v61.test.ts tests/final-player-facing-cross-contract-v64.test.ts
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Previous failures and preservation adjacency
        run: node --experimental-strip-types --test tests/chat3-artist-geisha-live-authored-v19.test.ts tests/guard-presentation-v16-c2-169-179.test.ts tests/undead-farm-production-presentation-reachability-c2-143.test.ts tests/lumber-stay-retirement-v17.test.ts tests/secret-debt-full-route-v12.test.ts tests/strong-meta-engine-integration-v7.test.ts tests/economy-start-balance-v14.test.ts tests/hard-work-bonus-mapping-v13.test.ts tests/presentation-ending-parity-v9.test.ts tests/presentation-source-integrity-v9.test.ts tests/presentation-locale-accessibility-v9.test.ts tests/night-flow.test.ts tests/activity.test.ts tests/migration.test.ts
      - name: Full regression diagnostic
        run: npm test
