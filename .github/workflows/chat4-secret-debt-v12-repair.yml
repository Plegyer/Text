name: Chat 4 Secret Debt v12 repair gate

on:
  push:
    branches:
      - chat4/qa-secret-debt-v12-repair-20261003-v1

defaults:
  run:
    working-directory: mindy-successor/prior-work/astra/prototype-m3.2

jobs:
  focused:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Validate
        run: npm run validate
      - name: Build
        run: npm run build
      - name: Secret Debt focused regressions
        run: >
          node --experimental-strip-types --test
          tests/secret-debt-full-route-v12.test.ts
          tests/night-flow.test.ts
          tests/ending-meta.test.ts
          tests/palace-d23-consumer-integration-v8.test.ts
          tests/activity.test.ts
          tests/school-engine-adapter.test.ts
          tests/ordinary-hard-work-meta-production.test.ts
