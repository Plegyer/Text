name: Chat 5 D47 producer focused QA

on:
  push:
    branches:
      - chat5/qa-d47-producer-v13

jobs:
  focused-d47:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - name: Checkout exact producer candidate
        uses: actions/checkout@v4
        with:
          ref: 3822b93f82850d9e052d3033135079d181e3bc46
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Validate
        run: npm run validate
      - name: Build
        run: npm run build
      - name: Focused D47 and cross-system regressions
        run: node --experimental-strip-types --test tests/hard-work-bonus-mapping-v13.test.ts tests/hard-work-meta-infra-prep.test.ts tests/hard-work-package-catalog-runtime.test.ts tests/hard-work-newstart-presentation-v2.test.ts tests/hard-work-newstart-ui-v2.test.ts tests/hard-work-meta-migration-v5.test.ts tests/ordinary-hard-work-meta-production.test.ts tests/ordinary-hard-work-lifecycle-parity.test.ts tests/hard-work-stat-cap-d24.test.ts tests/hard-work-palace-meta-smoke.test.ts tests/palace-d23-consumer-integration-v8.test.ts tests/chat3-secret-debt-separation-v2.test.ts tests/strong-meta-d30-runtime-v7.test.ts tests/strong-meta-engine-integration-v7.test.ts tests/strong-meta-registry-v7.test.ts tests/ending-meta.test.ts
