# rerun-base d902b943cb7c9608c7f7e5fd4fcc84d6dc75e9ec
name: Chat3 Lumber Check

on:
  push:
    branches:
      - chat3/lumber-live-slice
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mindy-successor/prior-work/astra/prototype-m3.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: mindy-successor/prior-work/astra/prototype-m3.2/package-lock.json
      - run: npm ci
      - run: npm run check
